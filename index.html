<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globo Studio CR</title>
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- FontAwesome para iconos de Redes Sociales y WhatsApp -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- BARRA SUPERIOR: Selector de Idioma e Iconos Sociales -->
    <header class="top-bar">
        <div class="social-icons">
            <a href="https://www.facebook.com/globostudiocr/" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/globostudio_cr/" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        </div>
        <div class="language-switcher">
            <button onclick="changeLanguage('es')" class="lang-btn">ES</button>
            <span>/</span>
            <button onclick="changeLanguage('en')" class="lang-btn">ENG</button>
        </div>
    </header>

    <!-- Contenido Principal de tu Sitio -->
    <main>
        <section class="hero">
            <h1 data-i18n="hero_title">Globos Impresos y Personalizados</h1>
            <p data-i18n="hero_subtitle">Soluciones de alta calidad para tu marca o evento.</p>
        </section>
    </main>

    <!-- BOTÓN FLOTANTE DE WHATSAPP -->
    <a href="https://wa.me/506XXXXXXXX" class="whatsapp-float" target="_blank" aria-label="WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
